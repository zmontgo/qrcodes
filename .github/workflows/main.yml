name: Build and Push

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build_and_upload:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag zachmontgomery.registry.cpln.io/qrcodes
    - name: Login to CPLN
      run: echo ${{ secrets.SERVICE_ACCOUNT_KEY }} | docker login zachmontgomery.registry.cpln.io -u '<token>' --password-stdin
    - name: Push to CPLN
      run: docker push zachmontgomery.registry.cpln.io/qrcodes
